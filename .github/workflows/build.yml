name: Build Villager Golem Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 8 (required for Forge 1.7.10)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Extract the mod zip from the repo root
        run: |
          mkdir -p work
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No .zip found in the repo root. Upload VillagerGolemMod.zip to the root of the repo."
            exit 1
          fi
          for z in "${zips[@]}"; do
            echo "Extracting $z"
            unzip -o -q "$z" -d work
          done
          echo "Extracted layout:"
          find work -maxdepth 3 | head -50

      - name: Locate the project folder (the one with build.gradle)
        id: locate
        run: |
          gradle_file=$(find work -name build.gradle -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$gradle_file" ]; then
            echo "No build.gradle found inside the zip."
            exit 1
          fi
          dir=$(dirname "$gradle_file")
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install Gradle 5.6.4 (works with the ForgeGradle 1.2 fork)
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-5.6.4-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-5.6.4/bin" >> "$GITHUB_PATH"

      - name: Build the mod
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          gradle --version
          gradle build --no-daemon --console=plain

      - name: Upload the built jar
        uses: actions/upload-artifact@v4
        with:
          name: VillagerGolem-jar
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
